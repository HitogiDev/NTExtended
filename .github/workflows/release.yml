name: Release

# Push a tag such as v0.2.0 to publish a release.
# The tag must match the version in package.json.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release, for example v0.2.0
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check the tag against package.json
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [ "v${VERSION}" != "${TAG}" ]; then
            echo "::error::Tag ${TAG} does not match package.json version ${VERSION}."
            exit 1
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      - run: npm ci
      - run: npm run typecheck

      - name: Package Chromium and Firefox
        run: |
          npm run zip
          npm run zip:firefox
          ls -l .output/*.zip

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: NTExtended ${{ env.TAG }}
          generate_release_notes: true
          prerelease: ${{ contains(env.TAG, '-') }}
          files: |
            .output/ntextended-${{ env.VERSION }}-chrome.zip
            .output/ntextended-${{ env.VERSION }}-firefox.zip
            .output/ntextended-${{ env.VERSION }}-sources.zip
          fail_on_unmatched_files: true
